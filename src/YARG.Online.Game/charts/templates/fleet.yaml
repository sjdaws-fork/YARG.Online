apiVersion: agones.dev/v1
kind: Fleet
metadata:
  name: {{ .Values.fleet.name }}
  labels:
    app.kubernetes.io/name: yarg-online-game
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.fleet.replicas }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: yarg-online-game
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      ports:
        - name: game
          portPolicy: {{ .Values.fleet.portPolicy }}
          containerPort: {{ .Values.fleet.containerPort }}
          protocol: {{ .Values.fleet.protocol }}
      lists:
        slots:
          capacity: {{ .Values.fleet.slotsCapacity }}
      health:
        initialDelaySeconds: {{ .Values.fleet.health.initialDelaySeconds }}
        periodSeconds: {{ .Values.fleet.health.periodSeconds }}
        failureThreshold: {{ .Values.fleet.health.failureThreshold }}
      template:
        # Pod template labels. Agones does NOT propagate the GameServer
        # template's metadata labels onto the spawned pod, so the PodMonitor
        # selector matches against these (set here on the inner pod template).
        metadata:
          labels:
            app.kubernetes.io/name: yarg-online-game
            app.kubernetes.io/instance: {{ .Release.Name }}
        spec:
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: game
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              # The UDP game port lives under spec.ports above (Agones-managed,
              # dynamically allocated). This TCP port is a plain pod port for
              # the Prometheus scrape endpoint — Agones does not touch it.
              ports:
                - name: metrics
                  containerPort: {{ .Values.monitoring.metricsPort }}
                  protocol: TCP
              env:
                - name: DOTNET_ENVIRONMENT
                  value: {{ .Values.env.dotnetEnvironment | default "Development" }}
                - name: Agones__Enabled
                  value: "true"
                - name: Lobbies__BaseUrl
                  value: {{ .Values.lobbies.baseUrl | quote }}
                - name: Network__MaxConnections
                  value: "{{ .Values.fleet.slotsCapacity }}"
                - name: Observability__MetricsPort
                  value: "{{ .Values.monitoring.metricsPort }}"
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
              envFrom:
                - secretRef:
                    name: yarg-online-game-secrets
              resources:
                {{- toYaml .Values.fleet.resources | nindent 16 }}
