image:
  repository: registry.chandler-compute-1/yarg-online-lobbies
  tag: ""
  pullPolicy: IfNotPresent

service:
  port: 5230

# ASP.NET Core environment. Defaults to Development; oci-prod overrides to Production.
env:
  aspNetCoreEnvironment: Development

# Pins the pod to a node pool by label. Empty on local (k3s); oci-prod sets
# workload=services to land on the OKE `services` pool.
nodeSelector: {}

httpRoute:
  enabled: true
  hostname: lobbies.chandler-compute-1
  parentRef:
    name: main
    namespace: envoy-gateway-system

# A dedicated, cluster-internal Gateway (ClusterIP Envoy) for the game-server
# callback endpoints under /api/v1/lobbies. Created in httpRoute.parentRef.namespace.
internalGateway:
  enabled: true
  name: lobbies-internal
  serviceName: lobbies-internal-gateway
  gatewayClassName: envoy

# NetworkPolicies restricting ingress to the lobbies pod and the internal
# Gateway. gameServerNamespace is the namespace the Agones game-server pods run
# in; oci-prod overrides it.
networkPolicy:
  enabled: true
  gameServerNamespace: game

# When enabled, renders ServiceAccount + Role + RoleBinding granting the lobbies pod
# permission to create GameServerAllocations and patch GameServers in the configured
# gameServerNamespace. The in-cluster lobby code detects the ServiceAccount token at
# runtime and selects the Agones allocator implementation.
agones:
  enabled: true
  gameServerNamespace: game
  fleetName: game-fleet
  slotsKey: slots

# Prometheus ServiceMonitor. The /metrics endpoint shares the existing http
# port (5230); no extra service port required. Disabled when the cluster has
# no Prometheus Operator (the CRD won't be installed). `namespace` is the
# kube-prometheus-stack release namespace — the NetworkPolicy opens the http
# port to it so Prometheus can scrape.
monitoring:
  namespace: monitoring
  serviceMonitor:
    enabled: true
    interval: 15s
    scrapeTimeout: 10s

# Populated per-environment from values/<env>/lobbies(.secrets).yaml. Each
# key/value is rendered into a Secret consumed by the deployment via envFrom.
secrets: {}
