{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lobbies
  labels:
    app.kubernetes.io/name: yarg-online-lobbies
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  parentRefs:
    - name: {{ .Values.httpRoute.parentRef.name }}
      namespace: {{ .Values.httpRoute.parentRef.namespace }}
  hostnames:
    - {{ .Values.httpRoute.hostname | quote }}
  rules:
    # Public surface only: the auth endpoints and the SignalR hub. Everything
    # else the service hosts -- /healthz, /readyz, /openapi, and the game-server
    # callbacks under /api/v1/lobbies -- is intentionally left unrouted here and
    # returns 404 at Envoy. The callbacks are served by the internal Gateway.
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/auth
        - path:
            type: PathPrefix
            value: /hubs
      backendRefs:
        - name: lobbies
          port: {{ .Values.service.port }}
{{- end }}
