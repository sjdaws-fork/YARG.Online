{{- if gt (len .Values.secrets) 0 }}
apiVersion: v1
kind: Secret
metadata:
  name: yarg-online-lobbies-secrets
  labels:
    app.kubernetes.io/name: yarg-online-lobbies
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
